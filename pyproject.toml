[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsi-spark"
version = "1.0.0"
description = "Latent Semantic Indexing on 20 Newsgroups, with a numpy vs Spark SVD benchmark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
spark = ["pyspark>=3.0"]
dev = ["pytest"]

[tool.setuptools]
packages = ["lsi"]
